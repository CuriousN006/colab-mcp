[project]
name = "colab-mcp"
version = "1.0.1"
description = "An MCP server for Colab"
readme = "README.md"
authors = [
    { name = "Tyler Pirtle", email = "rtp@google.com" },
    { name = "Josie Cuff", email = "josiecuff@google.com" },
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "fastmcp==4.1.0",
    "mcp[cli]>=2.3.0,<3.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "requests>=2.34.2",
    "websockets>=17.2",
    "requests-oauth2client>=1.8.0",
    "google-auth-oauthlib>=1.5.0",
    "jupyter-kernel-client>=1.0.2",
]

[project.scripts]
colab-mcp = "colab_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "fastmcp==4.1.0",
    "jupyter-kernel-client",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
commit = [
    "pre-commit>=4.7.0",
]

# For local development with the jupyter-kernel-client, uncomment this
# [tool.uv.sources]
# jupyter-kernel-client = { path = "../jupyter-kernel-client", editable = true }


[[tool.uv.index]]
url = "https://pypi.org/simple"
